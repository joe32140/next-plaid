name: Asym Rescore Bench

# Contention-free codec measurement on dedicated runners, across both SIMD
# kernel families:
#   ubuntu-latest    -> x86_64 (avx2 / avx512-vnni)
#   ubuntu-24.04-arm -> aarch64 (neon-sdot)
#
# Two levels:
#   * `asym-bench` — Stage-2 rescore in isolation (float decompress+MaxSim vs
#     #169's fused LUT), plus the ternary repack A/B.
#   * `e2e-latency` — whole-search latency down the codec ladder
#     (4-bit / 2-bit / ternary / 1-bit) x (float / asym) on a seeded synthetic
#     corpus, so no dataset is needed.
#
# Why CI and not a laptop: these are *latency* numbers, and latency measured on
# a machine running anything else measures that other thing. NDCG is not here
# on purpose — it is deterministic, so a contended machine reports it exactly
# right, and it needs the real bundles CI cannot carry.
on:
  push:
    branches: [integration/ternary-asym]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REPS: "9"
  TOKENS: "230"

jobs:
  asym-bench:
    name: Asym rescore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Build harness (release)
        run: cargo build --release -p next-plaid --example asym_rescore_check --features openblas
      - name: CPU features
        run: |
          echo "arch: $(uname -m)"
          lscpu | grep -iE "model name|flags" | head -2 || true
      - name: Rescore ratio — 4-bit (SIMD)
        run: ./target/release/examples/asym_rescore_check 4096 4
      - name: Rescore ratio — 2-bit (SIMD)
        run: ./target/release/examples/asym_rescore_check 4096 2
      - name: Rescore ratio — 1-bit (SIMD)
        run: ./target/release/examples/asym_rescore_check 4096 1
      - name: Rescore ratio — ternary (transcoded onto the SIMD kernels)
        run: ./target/release/examples/asym_rescore_check 4096 t
      # Both repack arms in ONE process: the effect here is smaller than the
      # +/-30% swing the same benchmark shows on *unchanged* code across two
      # runners, so it can only be resolved within a single process.
      - name: Build repack A/B
        run: cargo build --release -p next-plaid --example ternary_repack_bench --features openblas
      - name: Ternary repack — per-byte vs batched
        run: ./target/release/examples/ternary_repack_bench 4096 15
      # Two-hop (repack + nibble tbl) against one-hop (fused u64 straight to
      # weights). Decides whether the one-stage expansion is worth wiring into
      # the kernels, and what ternary would still owe 2-bit if it were.
      - name: Build expansion A/B
        run: cargo build --release -p next-plaid --example ternary_expand_bench --features openblas
      - name: Ternary expansion — two hops vs one
        run: ./target/release/examples/ternary_expand_bench 4096 15

  e2e-latency:
    name: E2E latency ladder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      DOCS: "4000"
      TOKENS: "180"
      QUERIES: "128"
      QTOKENS: "32"
      DIM: "128"
      # Few clusters make the candidate set saturate at shallow probe depths —
      # measured: 64 clusters left probe=8 and probe=32 within 3% of each other,
      # so the probe lever reported nothing. Real token embeddings are spread
      # over far more modes than that.
      CLUSTERS: "4096"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Build harness (release)
        run: cargo build --release -p next-plaid --example search_latency --features openblas
      - name: CPU features
        run: |
          echo "arch: $(uname -m), cores: $(nproc)"
          lscpu | grep -iE "model name" || true
      # Probe depth sets how many candidate docs reach the residual path, which
      # is the only place the codec choice can show up, so sweep it rather than
      # reporting one arbitrary point. All depths share one index build per
      # codec — k-means over the corpus costs more than the searches being
      # timed, so rebuilding per depth would spend the job on the wrong thing.
      - name: Codec ladder — probe sweep
        run: ./target/release/examples/search_latency synth 5 1,8,32,128
