name: LUT kernels

# Correctness and A/B for the asymmetric residual LUT rescore kernels
# (blocked NEON sdot; AVX2 and AVX-512 VNNI GEMM-tile forms).
#
# These kernels are selected by runtime CPU feature detection, so a green test
# on a runner that lacks the instruction proves nothing — the SIMD branch is
# just skipped. Every job below therefore asks the binary itself which kernel
# will dispatch (examples/lut_kernel_name) and FAILS if the answer is scalar.
#
# Runner ISA coverage:
#   ubuntu-24.04      x86_64   AVX2 guaranteed. AVX-512 is NOT reachable here:
#                              measured 2026-09-10, `is_x86_feature_detected!`
#                              returned false for avx512f on all three draws
#                              (EPYC 7763, EPYC 9V74 x2) — and the 9V74 is Zen 4,
#                              which has AVX-512 in hardware, so the VM is not
#                              enabling ZMM state rather than the pool lacking
#                              capable parts. kernel-matrix.yml calls this a
#                              lottery worth re-drawing; for AVX-512 on today's
#                              pool it is not. Two draws are kept because they
#                              do sample different cores (Zen 3 and Zen 4), and
#                              the x86 gain is strongly core-dependent.
#   ubuntu-24.04-arm  aarch64  NEON sdot on Neoverse
#   macos-latest      aarch64  NEON sdot on Apple Silicon, a different core
#                              from the Neoverse one and from the dev machine

on:
  push:
    branches: ['**']
    paths:
      - 'next-plaid/src/residual_lut.rs'
      - 'next-plaid/src/binary.rs'
      - 'next-plaid/examples/lut_*.rs'
      - '.github/workflows/lut-kernels.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # v1.7.0: the release whose kernels this change is measured against.
  BASE_SHA: 00e26aae0006b322727db277672211d9a0e3ccec

jobs:
  parity:
    name: Parity ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86-draw1
            os: ubuntu-24.04
            flags: --features openblas
          - name: linux-x86-draw2
            os: ubuntu-24.04
            flags: --features openblas
          - name: linux-arm64
            os: ubuntu-24.04-arm
            flags: --features openblas
          - name: macos-arm64
            os: macos-latest
            flags: --features accelerate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Which kernel will actually dispatch here
        run: |
          set -uo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string || true
          else
            lscpu | grep -iE 'model name|vendor id|architecture' || true
          fi
          # Authoritative, and deliberately not a /proc/cpuinfo grep: Linux
          # spells the AVX-512 VNNI bit `avx512_vnni` while the Rust feature is
          # `avx512vnni`, so a grep for either name silently misses the other
          # and a job can report "no AVX-512" on a CPU whose dispatch is using
          # it. This example asks the same runtime detection the dispatch asks,
          # and exits non-zero if only the scalar fallback is reachable — which
          # is what would make the kernel tests below pass vacuously.
          cargo run -p next-plaid --release ${{ matrix.flags }} --example lut_kernel_name

      - name: Residual LUT kernel parity vs the scalar reference
        run: cargo test -p next-plaid --release ${{ matrix.flags }} --lib residual_lut -- --nocapture

      - name: Full next-plaid suite
        run: cargo test -p next-plaid --release ${{ matrix.flags }}

      - name: Clippy for this target
        run: cargo clippy -p next-plaid --release --all-targets ${{ matrix.flags }} -- -D warnings

  ab:
    name: A/B vs 1.7.0 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86
            os: ubuntu-24.04
            flags: --features openblas
          - name: linux-arm64
            os: ubuntu-24.04-arm
            flags: --features openblas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Which kernel will actually dispatch here
        run: |
          set -uo pipefail
          lscpu | grep -iE 'model name|vendor id' || true
          # See the parity job: runtime detection, not a cpuinfo grep. An A/B
          # between two scalar fallbacks would look like a kernel result.
          cargo run -p next-plaid --release ${{ matrix.flags }} --example lut_kernel_name

      # Both arms are built and run on the SAME runner. GitHub's pools are
      # mixed, so a ratio stitched across two runs can be a hardware
      # difference wearing a kernel's clothes.
      - name: Build both arms
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base/next-plaid/examples"
          cp next-plaid/examples/lut_ab.rs "$RUNNER_TEMP/base/next-plaid/examples/"
          cargo build -p next-plaid --release ${{ matrix.flags }} \
            --example lut_ab --example lut_ci_index
          cd "$RUNNER_TEMP/base"
          cargo build -p next-plaid --release ${{ matrix.flags }} --example lut_ab

      # Document length is not a free parameter: the rescore kernel's share of
      # a query grows with tokens per document, so a corpus of short documents
      # understates the change. 240 tokens is the SciFact/ColBERTv2 working
      # point these kernels are tuned against.
      - name: Cache the synthetic index
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bench
          key: lut-bench-${{ runner.arch }}-${{ hashFiles('next-plaid/examples/lut_ci_index.rs') }}-d2000-t240-q50
      - name: Synthetic index, shared by both arms
        env:
          DOCS: 2000
          TOKENS: 240
          QUERIES: 50
        run: ./target/release/examples/lut_ci_index "$RUNNER_TEMP/bench"

      - name: Alternate the arms
        env:
          NQ: 50
          ROUNDS: 3
          WARMUP: 1
        run: |
          set -euo pipefail
          IDX="$RUNNER_TEMP/bench/index"
          Q="$RUNNER_TEMP/bench/queries.npy"
          OUT="$RUNNER_TEMP/bench"
          for C in 1024 4096; do
            export NFULL=$C
            for rep in 1 2 3; do
              "$RUNNER_TEMP/base/target/release/examples/lut_ab" "$IDX" "$Q" "$OUT" base
              ./target/release/examples/lut_ab "$IDX" "$Q" "$OUT" port
            done
            if diff -q "$OUT/top_base_c$C.tsv" "$OUT/top_port_c$C.tsv"; then
              echo "PARITY c=$C: $(wc -l < "$OUT/top_base_c$C.tsv") rows bit-identical to 1.7.0"
            else
              echo "::error::PARITY c=$C: scores differ from 1.7.0"
              diff "$OUT/top_base_c$C.tsv" "$OUT/top_port_c$C.tsv" | head -20
              exit 1
            fi
          done 2>&1 | tee "$RUNNER_TEMP/ab.log"

      - name: Summary
        run: |
          python3 - "$RUNNER_TEMP/ab.log" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, statistics, sys
          rows, depth = {}, None
          for line in open(sys.argv[1]):
              m = re.search(r"n_full_scores (\d+)", line)
              if m:
                  depth = int(m.group(1))
              m = re.match(r"\[(base|port)\] median ([\d.]+)", line)
              if m and depth:
                  rows.setdefault((depth, m.group(1)), []).append(float(m.group(2)))
          print("### LUT kernel A/B vs next-plaid 1.7.0")
          print()
          print("| n_full_scores | 1.7.0 ms | this ms | ratio |")
          print("|---|---|---|---|")
          for d in sorted({k[0] for k in rows}):
              b = statistics.median(rows[(d, "base")])
              p = statistics.median(rows[(d, "port")])
              print(f"| {d} | {b:.3f} | {p:.3f} | {b / p:.2f}x |")
          print()
          print("Synthetic corpus: 2000 docs x 240 tokens, dim 128, nbits 4,")
          print("both arms alternated on this one runner. The ratio tracks how")
          print("much of a query is rescoring, so it grows with document length")
          print("and rescore depth; the absolute ms are not a production figure.")
          print("Scores are asserted bit-identical to 1.7.0 in the step above.")
          PY
