name: Ternary Codec Bench

# What the ternary codec costs at query time, on dedicated runners, across both
# SIMD kernel families:
#   ubuntu-latest    -> x86_64
#   ubuntu-24.04-arm -> aarch64
#
# Two levels, because they answer different questions:
#   * `decode` — residual unpacking in isolation (criterion). Ternary turns one
#     byte into five values through a 256-entry table where the scalar rungs
#     shift and mask per dimension, so this is where the codecs actually differ.
#   * `e2e` — whole-search latency down the 4-bit / 2-bit / ternary / 1-bit
#     ladder on a seeded synthetic corpus, so no dataset is needed. An isolated
#     microbenchmark overstates any stage with heavy work to hide under, so the
#     decode delta is only believable once it is sized in situ.
#
# Why CI and not a laptop: these are *latency* numbers, and latency measured on
# a machine running anything else measures that other thing.
#
# Two constraints this workflow exists to respect:
#   1. Every codec is compared WITHIN one process. The same benchmark moves
#      +/-30% between runners, so cross-codec deltas taken from separate
#      invocations are noise. criterion sweeps all four rungs in one run and
#      search_latency builds all four in one process — do not split them.
#   2. GitHub's `ubuntu-latest` is not a fixed CPU. One workflow has been served
#      Xeon 8573C, EPYC 9V74 (avx512-vnni) and EPYC 7763 (avx2) across three
#      consecutive runs — different kernels, not just different clocks. Hence
#      `lscpu` in every job, and no comparison across runs.
on:
  push:
    branches: [feat/ternary-residual]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    name: Ternary bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      # Interpreting any of the numbers below requires knowing which CPU
      # produced them -- the runner label does not pin the microarchitecture.
      - name: CPU features
        run: |
          echo "arch: $(uname -m), cores: $(nproc)"
          lscpu | grep -iE "model name|flags" | head -2 || true

      - name: Residual decode — all four codecs, one criterion run
        run: cargo bench -p next-plaid --bench residual_decode --features openblas

      - name: Build e2e harness (release)
        run: cargo build --release -p next-plaid --example search_latency --features openblas

      # Probe depth sets how many candidate docs reach the residual path, which
      # is the only place the codec choice can show up, so sweep it rather than
      # reporting one arbitrary point. All depths share one index build per
      # codec -- k-means over the corpus costs more than the searches being
      # timed, so rebuilding per depth would spend the job on the wrong thing.
      #
      # 4096 clusters, not the default 64: measured, 64 left probe=8 and
      # probe=32 within 3% of each other because the candidate set saturates,
      # so the probe lever reported nothing.
      - name: Codec ladder — probe sweep (dim 128)
        env:
          DOCS: "4000"
          TOKENS: "180"
          QUERIES: "128"
          QTOKENS: "32"
          DIM: "128"
          CLUSTERS: "4096"
        run: ./target/release/examples/search_latency synth 5 1,8,32,128

      # dim 48 is a real deployment regime (LateOn-Code-edge) and the one where
      # ternary's byte count stops dividing evenly: ceil(48/5) = 10 B against
      # 2-bit's 12, so the storage ratio differs from dim 128's 26-vs-32.
      - name: Codec ladder — probe sweep (dim 48)
        env:
          DOCS: "4000"
          TOKENS: "180"
          QUERIES: "128"
          QTOKENS: "32"
          DIM: "48"
          CLUSTERS: "4096"
        run: ./target/release/examples/search_latency synth 5 1,8,32,128
